services:
  postgres:
    image: postgres:15-alpine
    container_name: mkt_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketing_db}
      POSTGRES_USER: ${POSTGRES_USER:-market_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersecret_db_pass_2026}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - mkt_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-market_admin} -d ${POSTGRES_DB:-marketing_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend_service:
    build:
      context: ./backend
    container_name: mkt_backend
    restart: always
    environment:
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-marketing_db}
      DB_USER: ${POSTGRES_USER:-market_admin}
      DB_PASS: ${POSTGRES_PASSWORD:-supersecret_db_pass_2026}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mkt_net

  frontend:
    build:
      context: ./frontend
    container_name: mkt_frontend
    restart: always
    environment:
      API_URL: "http://backend_service:8000"
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-marketing_db}
      DB_USER: ${POSTGRES_USER:-market_admin}
      DB_PASS: ${POSTGRES_PASSWORD:-supersecret_db_pass_2026}
    depends_on:
      - backend_service
    networks:
      - mkt_net

  jupyter:
    image: jupyter/datascience-notebook:latest
    container_name: mkt_jupyter
    restart: always
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-secret}
      JUPYTER_ENABLE_LAB: 'yes'
      DB_USER: ${POSTGRES_USER:-market_admin}
      DB_PASS: ${POSTGRES_PASSWORD:-supersecret_db_pass_2026}
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-marketing_db}
    volumes:
      - jupyter_data:/home/jovyan/work
      - ./jupyter_scripts:/home/jovyan/work/scripts
    networks:
      - mkt_net
    command: start-notebook.sh --NotebookApp.token='${JUPYTER_TOKEN:-secret}'

  metabase:
    image: metabase/metabase:latest
    container_name: mkt_metabase
    restart: always
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${POSTGRES_DB:-marketing_db}
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER:-market_admin}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-supersecret_db_pass_2026}
      MB_DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mkt_net

  nginx:
    image: nginx:alpine
    container_name: mkt_nginx
    restart: always
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:81:81"
      - "127.0.0.1:82:82"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend_service
      - jupyter
      - metabase
    networks:
      - mkt_net

networks:
  mkt_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.77.0.0/24

volumes:
  pg_data:
  jupyter_data: